<svg xmlns="http://www.w3.org/2000/svg" width="520" height="136" viewBox="0 0 520 136" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Ask more about Shashank — open the AI chat on his portfolio</title>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="typeClip">
      <rect x="62" y="20" height="44" width="0">
        <animate attributeName="width" calcMode="discrete" values="0.0;11.1;21.2;31.3;37.0;53.8;65.1;71.8;83.1;88.7;100.0;111.3;122.5;133.8;139.4;145.1;155.2;166.5;177.7;187.9;199.1;210.4;221.7;235.0;221.7;210.4;199.1;187.9;177.7;166.5;155.2;145.1;139.4;133.8;122.5;111.3;100.0;88.7;83.1;71.8;65.1;53.8;37.0;31.3;21.2;11.1;0.0" keyTimes="0.00000;0.10051;0.11140;0.12228;0.14725;0.16197;0.17286;0.18374;0.19462;0.21959;0.23431;0.24520;0.25608;0.26697;0.27785;0.30666;0.31754;0.32843;0.33931;0.35019;0.36492;0.37580;0.38668;0.39757;0.81178;0.81626;0.82074;0.82522;0.82971;0.83419;0.83867;0.84315;0.84763;0.85211;0.85659;0.86108;0.86556;0.87004;0.87452;0.87900;0.88348;0.88796;0.89245;0.89693;0.90141;0.90589;0.91037" dur="7.81s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    :root {
      --card: #faf9f5; --border: #dcd9cd; --text: #3d3d3a; --muted: #73726c;
      --accent: #d97757; --btn: #c6613f; --shadow: 0.14;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --card: #30302e; --border: #4a4843; --text: #f0eee6; --muted: #a9a79d;
        --accent: #d97757; --btn: #d97757; --shadow: 0.45;
      }
    }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
    .card { fill: var(--card); stroke: var(--border); stroke-width: 1.2; }
    .shadow { fill: #000; opacity: var(--shadow); }
    .ring { fill: none; stroke: var(--border); stroke-width: 1.2; }
    .plus { stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; fill: none; }
    .typed { fill: var(--text); font-size: 20px; font-weight: 400; }
    .model { fill: var(--muted); font-size: 13.5px; font-weight: 500; }
    .caret { fill: var(--accent); }
    .accent { stroke: var(--accent); fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .btn { fill: var(--btn); }
    .pulse { fill: var(--accent); transform-box: fill-box; transform-origin: center; animation: ring 2.8s ease-out infinite; }
    @keyframes ring { 0% { transform: scale(1); opacity: 0.45; } 70%, 100% { transform: scale(1.5); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 0; } }
  </style>

  <!-- soft elevation -->
  <rect class="shadow" x="14" y="16" width="492" height="112" rx="26" filter="url(#shadow)"/>

  <!-- card -->
  <rect class="card" x="4" y="4" width="512" height="120" rx="26"/>

  <!-- chat prompt mark -->
  <g transform="translate(36 40)">
    <path class="accent" stroke-width="2.2" d="M-6 -11 H6 A6 6 0 0 1 12 -5 V1 A6 6 0 0 1 6 7 H-1 L-8 12 L-7.2 7 H-6 A6 6 0 0 1 -12 1 V-5 A6 6 0 0 1 -6 -11 Z"/>
    <path class="accent" stroke-width="2" d="M-6.5 -4.5 L-2.5 -1 L-6.5 2.5"/>
    <path class="accent" stroke-width="2" d="M1.5 2.5 H6">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- typed placeholder -->
  <g class="sans">
    <g clip-path="url(#typeClip)">
      <text class="typed" x="62" y="47" textLength="232" lengthAdjust="spacingAndGlyphs">ask more about shashank</text>
    </g>
    <rect class="caret" y="29" width="2.2" height="23" rx="1.1">
      <animate attributeName="x" calcMode="discrete" values="62.0;74.8;84.9;95.0;100.7;117.5;128.8;135.5;146.8;152.4;163.7;175.0;186.2;197.5;203.1;208.8;218.9;230.2;241.4;251.6;262.8;274.1;285.4;295.5;285.4;274.1;262.8;251.6;241.4;230.2;218.9;208.8;203.1;197.5;186.2;175.0;163.7;152.4;146.8;135.5;128.8;117.5;100.7;95.0;84.9;74.8;62.0" keyTimes="0.00000;0.10051;0.11140;0.12228;0.14725;0.16197;0.17286;0.18374;0.19462;0.21959;0.23431;0.24520;0.25608;0.26697;0.27785;0.30666;0.31754;0.32843;0.33931;0.35019;0.36492;0.37580;0.38668;0.39757;0.81178;0.81626;0.82074;0.82522;0.82971;0.83419;0.83867;0.84315;0.84763;0.85211;0.85659;0.86108;0.86556;0.87004;0.87452;0.87900;0.88348;0.88796;0.89245;0.89693;0.90141;0.90589;0.91037" dur="7.81s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5001;0.99;1" dur="1.05s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
  </g>

  <!-- bottom toolbar -->
  <circle class="ring" cx="38" cy="96" r="15"/>
  <path class="plus" d="M38 89.5 V102.5 M31.5 96 H44.5"/>

  <text class="sans model" x="450" y="101" text-anchor="end">Shashank's portfolio AI</text>

  <!-- send -->
  <rect class="pulse" x="468" y="78" width="36" height="36" rx="11"/>
  <rect class="btn" x="468" y="78" width="36" height="36" rx="11"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M486 105 V89 M479 96 L486 89 L493 96">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
