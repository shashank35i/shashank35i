<svg xmlns="http://www.w3.org/2000/svg" width="720" height="110" viewBox="0 0 720 110" role="img" aria-labelledby="title desc">
  <title id="title">Engineering rhythm</title>
  <desc id="desc">A restrained engineering activity line that connects build, improve, and ship.</desc>
  <style>@media (prefers-reduced-motion: reduce) { #pulse { display: none; } }</style>
  <defs>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#30363d"/>
      <stop offset="0.48" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#30363d"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="110" rx="8" fill="#0d1117"/>
  <path d="M74 55H646" stroke="#21262d" stroke-width="1"/>
  <path d="M74 55H646" stroke="url(#line)" stroke-width="2"/>
  <g fill="#0d1117" stroke="#a855f7" stroke-width="2">
    <circle cx="128" cy="55" r="9"/>
    <circle cx="360" cy="55" r="9"/>
    <circle cx="592" cy="55" r="9"/>
  </g>
  <g fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2">
    <text x="128" y="91" text-anchor="middle">BUILD</text>
    <text x="360" y="91" text-anchor="middle">IMPROVE</text>
    <text x="592" y="91" text-anchor="middle">SHIP</text>
  </g>
  <g fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="1.2">
    <text x="128" y="29" text-anchor="middle">IDEA</text>
    <text x="360" y="29" text-anchor="middle">ITERATION</text>
    <text x="592" y="29" text-anchor="middle">RELEASE</text>
  </g>
  <circle id="pulse" r="4" fill="#a855f7" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M74 55H646"/>
  </circle>
</svg>
